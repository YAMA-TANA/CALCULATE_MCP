name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Build MCPB bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm prune --omit=dev
          rm -rf .mcpb-build
          mkdir -p .mcpb-build
          cp manifest.json package.json .mcpb-build/
          cp -R dist node_modules .mcpb-build/
          (cd .mcpb-build && zip -qr ../calculate-mcp-0.2.0.mcpb .)
          sha256sum calculate-mcp-0.2.0.mcpb | tee calculate-mcp-0.2.0.sha256
      - name: Upload MCPB artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: calculate-mcp-0.2.0
          path: |
            calculate-mcp-0.2.0.mcpb
            calculate-mcp-0.2.0.sha256
          if-no-files-found: error
      - name: Publish v0.2.0 GitHub Release once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 --target "$GITHUB_SHA" --title "CALCULATE_MCP v0.2.0" --notes "Deterministic calculation MCP with 13 tools for arithmetic, units, statistics, finance, matrices, complex numbers, calculus, probability, and dates."
            gh release upload v0.2.0 calculate-mcp-0.2.0.mcpb calculate-mcp-0.2.0.sha256
          else
            echo "v0.2.0 already exists; keeping published assets immutable."
          fi
